name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waytohome
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: waytohome_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waytohome"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://waytohome:localdev@localhost:5432/waytohome_test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://waytohome:localdev@localhost:5432/waytohome_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
